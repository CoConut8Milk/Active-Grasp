services:
  active-grasp:
    build: .
    image: active-grasp:humble
    volumes:
      - ../:/workspace
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - LIBGL_ALWAYS_SOFTWARE=1
    network_mode: host
    ipc: host
    working_dir: /workspace
    command: bash -c "colcon build --symlink-install && bash"

